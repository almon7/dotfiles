# ~/.tmux.conf — symlinked by tmux/install.sh
# To reload manually, tmux source-file <file>

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g base-index 1
set -g history-limit 50000
set -sg escape-time 10        # without this, Esc lags in Neovim
set -g focus-events on        # REQUIRED by config/autosave.lua

# Let WezTerm receive OSC metadata for prompts, command output, and pane paths.
set -g allow-passthrough on

# Neovim colorschemes are transparent; without these they render wrong.
# terminal-features matches the terminal tmux is *running inside* and covers
# every emulator (xterm-ghostty, xterm-kitty, …); the older terminal-overrides
# line is the fallback for tmux < 3.2, which has no terminal-features.
set -g default-terminal "tmux-256color"
set -s terminal-features[100] "*:RGB"
set -s terminal-overrides[100] "*256col*:Tc"

# Preserve modified keys such as Shift+Enter through tmux even when a TUI does
# not explicitly request the extended-key protocol. CSI-u matches modern TUIs.
set -s extended-keys always
set -s extended-keys-format csi-u
set -s terminal-features[101] "xterm*:extkeys"

setw -g mode-keys vi          # copy mode: hjkl, /, v, y

# mode-keys vi alone does NOT give you vim's v/y: tmux leaves `y` unbound and
# binds `v` to rectangle-toggle. Wire up the bindings people actually expect.
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel

# Always create windows and panes in the session directory set with `-c`.
bind | split-window -h -c "#{session_path}"
bind % split-window -h -c "#{session_path}"
bind - split-window -v -c "#{session_path}"
bind '"' split-window -v -c "#{session_path}"
bind c new-window -c "#{session_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Uppercase motions move the current pane by swapping it with its neighbour.
# `-d` keeps focus on the pane as it moves to its new position.
bind H swap-pane -d -t '{left-of}'
bind J swap-pane -d -t '{down-of}'
bind K swap-pane -d -t '{up-of}'
bind L swap-pane -d -t '{right-of}'
bind x kill-pane
bind r source-file ~/.tmux.conf \; display "reloaded"

# `l` above overrides tmux's default last-window; put it back on `a`.
bind a last-window

# Move through sessions in the chooser's default order (session index/creation)
# with left Option + vim-style motions, stopping at either end.
bind-key -n M-j if-shell \
  "test '#{session_id}' != \"$(tmux list-sessions -O creation -F '##{session_id}' | tail -n 1)\"" \
  "switch-client -n -O creation"
bind-key -n M-k if-shell \
  "test '#{session_id}' != \"$(tmux list-sessions -O creation -F '##{session_id}' | head -n 1)\"" \
  "switch-client -p -O creation"

# Let yanks pass through tmux to the client's clipboard (pairs with the
# OSC 52 setup in nvim/lua/config/options.lua).
set -g set-clipboard on

# Seamless nvim <-> tmux navigation, paired with christoomey/vim-tmux-navigator
# in nvim/lua/plugins/tmux.lua. Use tmux's foreground-command format instead of
# spawning `ps | grep` on every keypress, so terminal-to-nvim moves are instant.
is_vim='#{m/r:(^|/)(g?(view|n?vim?x?)(diff)?),#{pane_current_command}}'
bind-key -n C-h if-shell -F "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell -F "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell -F "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell -F "$is_vim" "send-keys C-l" "select-pane -R"

# Black bottom status bar with the session and windows centered as one group.
# The active window is identified by its `*`, without a colour highlight.
set -g status on
set -g status-position bottom
set -g status-style "bg=#000000,fg=#bac2de"
set -g status-justify absolute-centre
set -g status-left ""
set -g window-status-format "#[fg=#f5e0dc,bold]#{?window_start_flag,| #S |   ,}#[fg=#bac2de,nobold]#I:#W#F"
set -g window-status-current-format "#[fg=#f5e0dc,bold]#{?window_start_flag,| #S |   ,}#[fg=#bac2de,nobold]#I:#W#F"
set -g window-status-style "bg=#000000,fg=#bac2de"
set -g window-status-current-style "bg=#000000,fg=#bac2de"

# Use double separators with strong contrast for the active pane.
set -g pane-border-lines double
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#ff00ff"
set -g pane-border-status bottom
set -g pane-border-format ""

# C-l above takes over the shell's clear-screen; get it back on prefix C-l.
bind C-l send-keys 'C-l'

# Renumber windows when closing them
set-option -g renumber-windows on

# The plugin manager keeps this path in the server environment, and normally
# sets it from the run-shell line below, which tmux runs in the background.
# Setting it here publishes the path as soon as the server reads this file,
# which is what `tpm/bin/install_plugins` needs to run outside tmux.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

# Recreate sessions, windows, pane layouts, and working directories after a
# reboot. Continuum saves every 15 minutes and restores when the tmux server
# starts; use prefix + C-s/C-r for an immediate manual save/restore.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# TPM must stay at the bottom of the config.
run-shell '~/.tmux/plugins/tpm/tpm'
