# ~/.tmux.conf — symlinked by tmux/install.sh
# To reload manually, tmux source-file <file>

unbind C-b
set -g prefix C-a
bind C-a if-shell -F '#{==:#{pane_mode},copy-mode}' { send-keys -X cancel } \; send-prefix

set -g mouse on
set -g base-index 1
set -g history-limit 50000
set -sg escape-time 10        # without this, Esc lags in Neovim
set -g focus-events on        # REQUIRED by config/autosave.lua

# Let WezTerm receive OSC metadata for prompts, command output, and pane paths.
set -g allow-passthrough on

# Neovim colorschemes are transparent; without these they render wrong.
# terminal-features matches the terminal tmux is *running inside* and covers
# every emulator (xterm-ghostty, xterm-kitty, …); the older terminal-overrides
# line is the fallback for tmux < 3.2, which has no terminal-features.
set -g default-terminal "tmux-256color"
set -s terminal-features[100] "*:RGB"
set -s terminal-overrides[100] "*256col*:Tc"

# Preserve modified keys such as Shift+Enter through tmux even when a TUI does
# not explicitly request the extended-key protocol. CSI-u matches modern TUIs.
set -s extended-keys always
set -s extended-keys-format csi-u
set -s terminal-features[101] "xterm*:extkeys"

# Neovim/Vim owns clicks and drags when it requests mouse input.
# Share the foreground-command detector with keyboard navigation below.
is_vim='#{m/r:(^|/)(g?(view|n?vim?x?)(diff)?),#{pane_current_command}}'
vim_mouse="#{&&:$is_vim,#{mouse_any_flag}}"

# Other applications use terminal selection confined to tmux's pane boundaries.
# Copy-mode holds selections and scrollback; the first key resumes input.
unbind -q [
unbind -q PPage
unbind -q >
unbind -qn MouseDown1ScrollbarUp
unbind -qn MouseDown1ScrollbarDown
unbind -qn MouseDrag1ScrollbarSlider
unbind -qn MouseDown3Pane
unbind -qn M-MouseDown3Pane
bind -n MouseUp1Pane if-shell -F -t = "$vim_mouse" { send-keys -M }
bind -n MouseDragEnd1Pane if-shell -F -t = "$vim_mouse" { send-keys -M }
bind -n SecondClick1Pane if-shell -F -t = "$vim_mouse" { send-keys -M }
bind -n MouseDown1Pane select-pane -t = \; if-shell -F -t = "$vim_mouse" {
  if-shell -F -t = '#{==:#{pane_mode},copy-mode}' { send-keys -t = -X cancel }
  send-keys -M
} {
  if-shell -F -t = '#{==:#{pane_mode},copy-mode}' {
    if-shell -F -t = '#{>:#{scroll_position},0}' { send-keys -t = -X clear-selection } { send-keys -t = -X cancel }
  }
}
bind -n MouseDrag1Pane select-pane -t = \; if-shell -F -t = "$vim_mouse" {
  send-keys -M
} { copy-mode -HM -t = }
bind -n DoubleClick1Pane select-pane -t = \; if-shell -F -t = "$vim_mouse" {
  send-keys -M
} { copy-mode -H -t = ; send-keys -t = -X select-word ; send-keys -t = -X stop-selection }
bind -n TripleClick1Pane select-pane -t = \; if-shell -F -t = "$vim_mouse" {
  send-keys -M
} { copy-mode -H -t = ; send-keys -t = -X select-line ; send-keys -t = -X stop-selection }

# Private terminal sequences bridge WezTerm copy/paste without using app keys.
set -s user-keys[90] "\e[99;13~"
set -s user-keys[91] "\e[99;14~"
bind -n User90 { }
bind -n User91 { }

# Replace defaults (including h/j/k/l/y) and stale bindings on every reload.
unbind -a -T copy-mode
bind -T copy-mode Any if-shell -F '#{==:#{mouse_x},}' { send-keys -X cancel ; send-keys }
bind -T copy-mode User90 if-shell -F '#{selection_present}' { send-keys -X copy-selection }
bind -T copy-mode User91 send-keys -X cancel
bind -T copy-mode MouseDown1Pane select-pane -t = \; if-shell -F -t = "$vim_mouse" {
  send-keys -t = -X cancel
  send-keys -M
} {
  if-shell -F -t = '#{>:#{scroll_position},0}' { send-keys -t = -X clear-selection } { send-keys -t = -X cancel }
}
bind -T copy-mode MouseDrag1Pane send-keys -t = -X begin-selection
# An edge drag can leave tmux's scroll timer running after release. Park the copy-mode cursor one row inward while preserving the highlight; panes with fewer than three rows have no interior row.
bind -T copy-mode MouseDragEnd1Pane {
  send-keys -t = -X stop-selection
  if-shell -F -t = '#{&&:#{>:#{pane_height},2},#{==:#{copy_cursor_y},0}}' { send-keys -t = -X cursor-down }
  if-shell -F -t = '#{&&:#{>:#{pane_height},2},#{==:#{copy_cursor_y},#{e|-:#{pane_height},1}}}' { send-keys -t = -X cursor-up }
}
bind -T copy-mode MouseUp1Pane { }
bind -T copy-mode SecondClick1Pane { }
bind -T copy-mode MouseDown1Border send-keys -X cancel \; select-pane -M
bind -T copy-mode MouseDown1Status send-keys -X cancel \; switch-client -t =
bind -T copy-mode MouseDown3Pane send-keys -X cancel
bind -T copy-mode DoubleClick1Pane send-keys -X select-word \; send-keys -X stop-selection
bind -T copy-mode TripleClick1Pane send-keys -X select-line \; send-keys -X stop-selection
bind -T copy-mode WheelUpPane if-shell -F -t = '#{mouse_any_flag}' {
  send-keys -t = -X cancel
  send-keys -M
} {
  send-keys -t = -X clear-selection
  send-keys -t = -X -N 3 scroll-up
  if-shell -F -t = '#{==:#{scroll_position},0}' { send-keys -t = -X cancel }
}
bind -T copy-mode WheelDownPane if-shell -F -t = '#{mouse_any_flag}' {
  send-keys -t = -X cancel
  send-keys -M
} {
  send-keys -t = -X clear-selection
  send-keys -t = -X -N 3 scroll-down-and-cancel
}

# Replace defaults (including h/j/k/l/y) and stale bindings on every reload.
unbind -a -T copy-mode-vi
bind -T copy-mode-vi Any if-shell -F '#{==:#{mouse_x},}' { send-keys -X cancel ; send-keys }
bind -T copy-mode-vi User90 if-shell -F '#{selection_present}' { send-keys -X copy-selection }
bind -T copy-mode-vi User91 send-keys -X cancel
bind -T copy-mode-vi MouseDown1Pane select-pane -t = \; if-shell -F -t = "$vim_mouse" {
  send-keys -t = -X cancel
  send-keys -M
} {
  if-shell -F -t = '#{>:#{scroll_position},0}' { send-keys -t = -X clear-selection } { send-keys -t = -X cancel }
}
bind -T copy-mode-vi MouseDrag1Pane send-keys -t = -X begin-selection
bind -T copy-mode-vi MouseDragEnd1Pane {
  send-keys -t = -X stop-selection
  if-shell -F -t = '#{&&:#{>:#{pane_height},2},#{==:#{copy_cursor_y},0}}' { send-keys -t = -X cursor-down }
  if-shell -F -t = '#{&&:#{>:#{pane_height},2},#{==:#{copy_cursor_y},#{e|-:#{pane_height},1}}}' { send-keys -t = -X cursor-up }
}
bind -T copy-mode-vi MouseUp1Pane { }
bind -T copy-mode-vi SecondClick1Pane { }
bind -T copy-mode-vi MouseDown1Border send-keys -X cancel \; select-pane -M
bind -T copy-mode-vi MouseDown1Status send-keys -X cancel \; switch-client -t =
bind -T copy-mode-vi MouseDown3Pane send-keys -X cancel
bind -T copy-mode-vi DoubleClick1Pane send-keys -X select-word \; send-keys -X stop-selection
bind -T copy-mode-vi TripleClick1Pane send-keys -X select-line \; send-keys -X stop-selection
bind -T copy-mode-vi WheelUpPane if-shell -F -t = '#{mouse_any_flag}' {
  send-keys -t = -X cancel
  send-keys -M
} {
  send-keys -t = -X clear-selection
  send-keys -t = -X -N 3 scroll-up
  if-shell -F -t = '#{==:#{scroll_position},0}' { send-keys -t = -X cancel }
}
bind -T copy-mode-vi WheelDownPane if-shell -F -t = '#{mouse_any_flag}' {
  send-keys -t = -X cancel
  send-keys -M
} {
  send-keys -t = -X clear-selection
  send-keys -t = -X -N 3 scroll-down-and-cancel
}

# Applications own their mouse input; other panes scroll retained terminal output.
# Use explicit mouse targets so scrolling an inactive pane does not move focus.
bind -n WheelUpPane if-shell -F -t = '#{mouse_any_flag}' { send-keys -M } {
  copy-mode -e -t =
  send-keys -t = -X -N 3 scroll-up
  if-shell -F -t = '#{==:#{scroll_position},0}' { send-keys -t = -X cancel }
}
bind -n WheelDownPane if-shell -F -t = '#{mouse_any_flag}' { send-keys -M }

# WezTerm sends Ctrl-F9/F10 for Cmd-Up/Down. Scroll the active pane one line;
# Neovim handles its own windows, including when its mouse support is disabled.
bind -n C-F9 if-shell -F "$is_vim" { send-keys C-F9 } {
  copy-mode -e
  send-keys -X scroll-up
  if-shell -F '#{==:#{scroll_position},0}' { send-keys -X cancel }
}
bind -n C-F10 if-shell -F "$is_vim" { send-keys C-F10 }
bind -T copy-mode C-F9 send-keys -X clear-selection \; send-keys -X scroll-up
bind -T copy-mode C-F10 send-keys -X clear-selection \; send-keys -X scroll-down-and-cancel
bind -T copy-mode-vi C-F9 send-keys -X clear-selection \; send-keys -X scroll-up
bind -T copy-mode-vi C-F10 send-keys -X clear-selection \; send-keys -X scroll-down-and-cancel

# Cmd-U/D moves one third of the active pane height, recalculated after resizing.
# Keep a minimum of one line for panes shorter than three rows.
scroll_third='#{?#{e|<:#{pane_height},3},1,#{e|/:#{pane_height},3}}'
bind -n C-F11 if-shell -F "$is_vim" { send-keys C-F11 } {
  copy-mode -e
  send-keys -X -N "$scroll_third" scroll-up
  if-shell -F '#{==:#{scroll_position},0}' { send-keys -X cancel }
}
bind -n C-F12 if-shell -F "$is_vim" { send-keys C-F12 }
bind -T copy-mode C-F11 send-keys -X clear-selection \; send-keys -X -N "$scroll_third" scroll-up
bind -T copy-mode C-F12 send-keys -X clear-selection \; send-keys -X -N "$scroll_third" scroll-down-and-cancel
bind -T copy-mode-vi C-F11 send-keys -X clear-selection \; send-keys -X -N "$scroll_third" scroll-up
bind -T copy-mode-vi C-F12 send-keys -X clear-selection \; send-keys -X -N "$scroll_third" scroll-down-and-cancel

# Publish active-pane selection state to each client's WezTerm (also over SSH).
# Indexed hooks preserve hooks installed by plugins or the user.
set-hook -g pane-mode-changed[90] 'run-shell "bash ~/.tmux/selection-state.sh #{q:socket_path}"'
set-hook -g pane-focus-in[90] 'run-shell "bash ~/.tmux/selection-state.sh #{q:socket_path}"'
set-hook -g after-select-pane[90] {
  if-shell -F '#{>:#{window_panes},1}' {
    if-shell -F -t '{last}' '#{==:#{pane_mode},copy-mode}' {
      if-shell -F -t '{last}' '#{>:#{scroll_position},0}' { send-keys -t '{last}' -X clear-selection } { send-keys -t '{last}' -X cancel }
    }
  }
  run-shell 'bash ~/.tmux/selection-state.sh #{q:socket_path}'
}
set-hook -g after-select-window[90] {
  if-shell -F '#{>:#{session_windows},1}' { if-shell -F -t '{last}.' '#{==:#{pane_mode},copy-mode}' { send-keys -t '{last}.' -X cancel } }
  run-shell 'bash ~/.tmux/selection-state.sh #{q:socket_path}'
}
set-hook -g after-new-window[90] {
  if-shell -F '#{>:#{session_windows},1}' { if-shell -F -t '{last}.' '#{==:#{pane_mode},copy-mode}' { send-keys -t '{last}.' -X cancel } }
  run-shell 'bash ~/.tmux/selection-state.sh #{q:socket_path}'
}
set-hook -g after-split-window[90] {
  if-shell -F '#{>:#{window_panes},1}' { if-shell -F -t '{last}' '#{==:#{pane_mode},copy-mode}' { send-keys -t '{last}' -X cancel } }
  run-shell 'bash ~/.tmux/selection-state.sh #{q:socket_path}'
}
set-hook -g client-attached[90] 'run-shell "bash ~/.tmux/selection-state.sh #{q:socket_path}"'
set-hook -g client-session-changed[90] 'run-shell "bash ~/.tmux/selection-state.sh #{q:socket_path}"'
set-hook -g client-detached[90] 'run-shell "bash ~/.tmux/selection-state.sh #{q:socket_path} #{q:hook_client}"'
run-shell 'bash ~/.tmux/selection-state.sh #{q:socket_path}'

# Match Neovim and picker navigation: stop at the layout's outer edges.
# Keyboard pane navigation returns to live output before changing focus.
navigate_left='if-shell -F "#{pane_at_left}" "" { if-shell -F "#{==:#{pane_mode},copy-mode}" { send-keys -X cancel }; select-pane -L }'
navigate_down='if-shell -F "#{pane_at_bottom}" "" { if-shell -F "#{==:#{pane_mode},copy-mode}" { send-keys -X cancel }; select-pane -D }'
navigate_up='if-shell -F "#{pane_at_top}" "" { if-shell -F "#{==:#{pane_mode},copy-mode}" { send-keys -X cancel }; select-pane -U }'
navigate_right='if-shell -F "#{pane_at_right}" "" { if-shell -F "#{==:#{pane_mode},copy-mode}" { send-keys -X cancel }; select-pane -R }'

# Always create windows and panes in the session directory set with `-c`.
bind | split-window -h -c "#{session_path}"
bind % split-window -h -c "#{session_path}"
bind - split-window -v -c "#{session_path}"
bind '"' split-window -v -c "#{session_path}"
bind c new-window -c "#{session_path}"
bind h $navigate_left
bind j $navigate_down
bind k $navigate_up
bind l $navigate_right
# Uppercase motions move the current pane by swapping it with its neighbour.
# `-d` keeps focus on the pane as it moves to its new position.
bind H swap-pane -d -t '{left-of}'
bind J swap-pane -d -t '{down-of}'
bind K swap-pane -d -t '{up-of}'
bind L swap-pane -d -t '{right-of}'
bind x kill-pane
bind r source-file ~/.tmux.conf \; display "reloaded"

# `l` above overrides tmux's default last-window; put it back on `a`.
bind a if-shell -F '#{==:#{pane_mode},copy-mode}' { send-keys -X cancel } \; last-window
bind n if-shell -F '#{==:#{pane_mode},copy-mode}' { send-keys -X cancel } \; next-window
bind p if-shell -F '#{==:#{pane_mode},copy-mode}' { send-keys -X cancel } \; previous-window

# Retire old root bindings on reload; ordinary Control and Meta keys reach apps.
unbind -qn C-h
unbind -qn C-j
unbind -qn C-k
unbind -qn C-l
unbind -qn M-j
unbind -qn M-k

# WezTerm sends Ctrl-F5/F6 for Cmd-n/p to switch windows within the session.
bind -n C-F5 if-shell -F '#{==:#{pane_mode},copy-mode}' { send-keys -X cancel } \; next-window
bind -n C-F6 if-shell -F '#{==:#{pane_mode},copy-mode}' { send-keys -X cancel } \; previous-window
bind -T copy-mode C-F5 send-keys -X cancel \; next-window
bind -T copy-mode C-F6 send-keys -X cancel \; previous-window
bind -T copy-mode-vi C-F5 send-keys -X cancel \; next-window
bind -T copy-mode-vi C-F6 send-keys -X cancel \; previous-window

# WezTerm sends Ctrl-F7/F8 for Cmd-]/[ to switch sessions, stopping at either end. The order is tmux's own session order, which is by name.
# `switch-client -O` would let us ask for creation order instead, but it is
# too new to rely on, so the guards compare against the name-ordered list.
bind-key -n C-F7 if-shell \
  "test '#{session_id}' != \"$(tmux list-sessions -F '##{session_id}' | tail -n 1)\"" \
  "switch-client -n"
bind-key -n C-F8 if-shell \
  "test '#{session_id}' != \"$(tmux list-sessions -F '##{session_id}' | head -n 1)\"" \
  "switch-client -p"

# Let yanks pass through tmux to the client's clipboard (pairs with the
# OSC 52 setup in nvim/lua/config/options.lua).
set -g set-clipboard on

# WezTerm sends Ctrl-F1/F2/F3/F4 for Cmd-h/j/k/l. Seamless Neovim/tmux navigation is paired with christoomey/vim-tmux-navigator in nvim/lua/plugins/tmux.lua. Use tmux's foreground-command format instead of spawning `ps | grep` on every keypress, so terminal-to-nvim moves are instant.
bind-key -n C-F1 if-shell -F "$is_vim" "send-keys C-F1" "$navigate_left"
bind-key -n C-F2 if-shell -F "$is_vim" "send-keys C-F2" "$navigate_down"
bind-key -n C-F3 if-shell -F "$is_vim" "send-keys C-F3" "$navigate_up"
bind-key -n C-F4 if-shell -F "$is_vim" "send-keys C-F4" "$navigate_right"

# Replay application keys directly: client-level replay can lose the first key.
# These root shortcuts need their normal tmux routing after selection is cleared.
bind -T copy-mode C-F1 send-keys -X cancel \; if-shell -F "$is_vim" "send-keys C-F1" "$navigate_left"
bind -T copy-mode C-F2 send-keys -X cancel \; if-shell -F "$is_vim" "send-keys C-F2" "$navigate_down"
bind -T copy-mode C-F3 send-keys -X cancel \; if-shell -F "$is_vim" "send-keys C-F3" "$navigate_up"
bind -T copy-mode C-F4 send-keys -X cancel \; if-shell -F "$is_vim" "send-keys C-F4" "$navigate_right"
bind -T copy-mode C-F7 send-keys -X cancel \; if-shell \
  "test '#{session_id}' != \"$(tmux list-sessions -F '##{session_id}' | tail -n 1)\"" \
  "switch-client -n"
bind -T copy-mode C-F8 send-keys -X cancel \; if-shell \
  "test '#{session_id}' != \"$(tmux list-sessions -F '##{session_id}' | head -n 1)\"" \
  "switch-client -p"
bind -T copy-mode-vi C-F1 send-keys -X cancel \; if-shell -F "$is_vim" "send-keys C-F1" "$navigate_left"
bind -T copy-mode-vi C-F2 send-keys -X cancel \; if-shell -F "$is_vim" "send-keys C-F2" "$navigate_down"
bind -T copy-mode-vi C-F3 send-keys -X cancel \; if-shell -F "$is_vim" "send-keys C-F3" "$navigate_up"
bind -T copy-mode-vi C-F4 send-keys -X cancel \; if-shell -F "$is_vim" "send-keys C-F4" "$navigate_right"
bind -T copy-mode-vi C-F7 send-keys -X cancel \; if-shell \
  "test '#{session_id}' != \"$(tmux list-sessions -F '##{session_id}' | tail -n 1)\"" \
  "switch-client -n"
bind -T copy-mode-vi C-F8 send-keys -X cancel \; if-shell \
  "test '#{session_id}' != \"$(tmux list-sessions -F '##{session_id}' | head -n 1)\"" \
  "switch-client -p"

# Black bottom status bar with the session and windows centered as one group.
# The active window is identified by its `*`, without a colour highlight.
set -g status on
set -g status-position bottom
set -g status-style "bg=#000000,fg=#bac2de"
set -g status-justify absolute-centre
set -g status-left ""
set -g window-status-format "#[fg=#f5e0dc,bold]#{?window_start_flag,| #S |   ,}#[fg=#bac2de,nobold]#I:#W#F"
set -g window-status-current-format "#[fg=#f5e0dc,bold]#{?window_start_flag,| #S |   ,}#[fg=#bac2de,nobold]#I:#W#F"
set -g window-status-style "bg=#000000,fg=#bac2de"
set -g window-status-current-style "bg=#000000,fg=#bac2de"

# Use double separators with strong contrast for the active pane.
set -g pane-border-lines double
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#ff00ff"
set -g pane-border-status bottom
set -g pane-border-format ""

# Keep the explicit prefix clear-screen shortcut alongside ordinary Ctrl-l.
bind C-l if-shell -F '#{==:#{pane_mode},copy-mode}' { send-keys -X cancel } \; send-keys 'C-l'
bind ] if-shell -F '#{==:#{pane_mode},copy-mode}' { send-keys -X cancel } \; paste-buffer -p

# Renumber windows when closing them
set-option -g renumber-windows on

# The plugin manager keeps this path in the server environment, and normally
# sets it from the run-shell line below, which tmux runs in the background.
# Setting it here publishes the path as soon as the server reads this file,
# which is what `tpm/bin/install_plugins` needs to run outside tmux.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

# Recreate sessions, windows, pane layouts, and working directories after a
# reboot. Continuum saves every 15 minutes and restores when the tmux server
# starts; use prefix + C-s/C-r for an immediate manual save/restore.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# TPM must stay at the bottom of the config.
run-shell '~/.tmux/plugins/tpm/tpm'
